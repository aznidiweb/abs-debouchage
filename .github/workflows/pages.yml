# Publie le site sur GitHub Pages à chaque modification de la branche main.
name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Générer le site
        # Adresse provisoire aznidiweb.github.io/abs-debouchage/ : le site vit dans un sous-dossier.
        # Le jour où le domaine abs-debouchage.be est branché, remplacer par BASE_PATH: ""
        env:
          BASE_PATH: /abs-debouchage
        run: python3 src/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
