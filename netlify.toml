# Le site est déjà construit dans public/ : Netlify le publie tel quel.
[build]
  publish = "public"
  command = ""

# Ancienne adresse sans "www" → version www (si le domaine est branché)
# Les pages gardent les mêmes adresses que l'ancien site (/debouchage-wc, /contact, ...)

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[redirects]]
  from = "/fr/*"
  to = "/:splat"
  status = 301
